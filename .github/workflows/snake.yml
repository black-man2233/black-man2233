name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F97316&color_dots=#EBE3D6,#E9C9A0,#D99A5C,#B56A2F,#7A4A28
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F6ECDD&color_dots=#161B22,#4E2E18,#7A4A28,#C07A3E,#FFB46B

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
